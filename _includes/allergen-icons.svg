<!-- Allergen line icons. Single-color: inherits `currentColor` via stroke.
     Referenced from recipe pages with <svg class="allergen-icon"><use href="#ai-NAME"></use></svg>.
     viewBox 0 0 24 24, drawn as 1.6px strokes (no fill). Shapes are kept simple
     with open interiors so they stay legible at ~19px. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <!-- Milk / dairy: glass of milk (distinct from the mustard bottle) -->
    <symbol id="ai-milk" viewBox="0 0 24 24">
      <path d="M7 4h10l-1.2 15.1a1 1 0 0 1-1 .9H9.2a1 1 0 0 1-1-.9L7 4z"/>
      <line x1="7.5" y1="9" x2="16.5" y2="9"/>
    </symbol>

    <!-- Wheat / gluten: stalk with paired grain strokes -->
    <symbol id="ai-wheat" viewBox="0 0 24 24">
      <line x1="12" y1="21" x2="12" y2="5"/>
      <path d="M12 14.5 8.6 12.7M12 14.5 15.4 12.7"/>
      <path d="M12 11.5 8.6 9.7M12 11.5 15.4 9.7"/>
      <path d="M12 8.5 9 6.7M12 8.5 15 6.7"/>
      <path d="M12 5.5 9.6 3.8M12 5.5 14.4 3.8"/>
    </symbol>

    <!-- Eggs: single egg -->
    <symbol id="ai-egg" viewBox="0 0 24 24">
      <path d="M12 3c-3.3 0-5.8 4.6-5.8 9a5.8 5.8 0 0 0 11.6 0C17.8 7.6 15.3 3 12 3z"/>
    </symbol>

    <!-- Soy: two beans -->
    <symbol id="ai-soy" viewBox="0 0 24 24">
      <ellipse cx="9" cy="9" rx="3.4" ry="2.6" transform="rotate(-32 9 9)"/>
      <ellipse cx="15" cy="15" rx="3.4" ry="2.6" transform="rotate(-32 15 15)"/>
    </symbol>

    <!-- Peanut: shell with a waist -->
    <symbol id="ai-peanut" viewBox="0 0 24 24">
      <path d="M12 3.6a3.3 3.3 0 0 1 2.3 5.6c-.8.8-1.2 1.4-1.2 2.2s.4 1.4 1.2 2.2a3.3 3.3 0 1 1-4.6 0c.8-.8 1.2-1.4 1.2-2.2s-.4-1.4-1.2-2.2A3.3 3.3 0 0 1 12 3.6z"/>
      <line x1="10.2" y1="9.4" x2="13.8" y2="9.4"/>
    </symbol>

    <!-- Tree nuts: acorn -->
    <symbol id="ai-nut" viewBox="0 0 24 24">
      <path d="M6.5 9a5.5 5.5 0 0 1 11 0z"/>
      <path d="M7.5 9c0 5.2 2 9.5 4.5 9.5s4.5-4.3 4.5-9.5"/>
      <line x1="12" y1="3" x2="12" y2="5"/>
    </symbol>

    <!-- Fish -->
    <symbol id="ai-fish" viewBox="0 0 24 24">
      <path d="M3.5 12c2.8-4.2 8.8-4.2 11.6 0-2.8 4.2-8.8 4.2-11.6 0z"/>
      <path d="M15.1 12 20.5 8.5v7z"/>
      <circle cx="7" cy="10.6" r="0.7" fill="currentColor"/>
    </symbol>

    <!-- Shellfish: shrimp -->
    <symbol id="ai-shellfish" viewBox="0 0 24 24">
      <path d="M17.5 7.5A6.5 6.5 0 1 0 11 18"/>
      <path d="M11 18l-2.2 1 .4-2.5"/>
      <path d="M17.5 7.5c1.3-.2 2.4.3 3.2 1.3"/>
      <path d="M9.6 9.6l1 .5M8.8 11.7l1 .4M8.7 13.8l1 .2"/>
      <circle cx="15.7" cy="7.9" r="0.65" fill="currentColor"/>
    </symbol>

    <!-- Sesame: three seeds -->
    <symbol id="ai-sesame" viewBox="0 0 24 24">
      <ellipse cx="9" cy="10" rx="1.8" ry="2.9" transform="rotate(-22 9 10)"/>
      <ellipse cx="15" cy="9.5" rx="1.8" ry="2.9" transform="rotate(20 15 9.5)"/>
      <ellipse cx="12" cy="15" rx="1.8" ry="2.9" transform="rotate(-4 12 15)"/>
    </symbol>

    <!-- Mustard: squeeze bottle -->
    <symbol id="ai-mustard" viewBox="0 0 24 24">
      <path d="M10 2.5h4v2.2l1 2.3V20a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20V7l1-2.3V2.5z"/>
      <line x1="9" y1="11" x2="15" y2="11"/>
    </symbol>

    <!-- Celery: stalk with leaves -->
    <symbol id="ai-celery" viewBox="0 0 24 24">
      <path d="M12 22V8"/>
      <path d="M12 8c-3.2-1-5.2 1-5.2 4.2"/>
      <path d="M12 8c3.2-1 5.2 1 5.2 4.2"/>
      <path d="M12 8c0-3.2 2-5.2 4.4-5.2"/>
    </symbol>

    <!-- Fallback: generic warning -->
    <symbol id="ai-generic" viewBox="0 0 24 24">
      <path d="M12 3.5l9 16.5H3z"/>
      <line x1="12" y1="10" x2="12" y2="14.5"/>
      <circle cx="12" cy="17.5" r="0.7" fill="currentColor"/>
    </symbol>

  </defs>
</svg>
