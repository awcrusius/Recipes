<!-- Allergen line icons. Single-color: inherits `currentColor` via stroke.
     Referenced from recipe pages with <svg class="allergen-icon"><use href="#ai-NAME"></use></svg>.
     viewBox 0 0 24 24, drawn as 1.6px strokes (no fill) for a clean line-art look. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <!-- Milk / dairy: bottle (matches the reference icon) -->
    <symbol id="ai-milk" viewBox="0 0 24 24">
      <path d="M9 2h6v3l1.4 2.8A4 4 0 0 1 17 9.6V20a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9.6a4 4 0 0 1 .6-1.8L9 5V2z"/>
      <line x1="7" y1="12" x2="17" y2="12"/>
    </symbol>

    <!-- Wheat / gluten: stalk with grain ears -->
    <symbol id="ai-wheat" viewBox="0 0 24 24">
      <line x1="12" y1="22" x2="12" y2="10"/>
      <path d="M12 12c-2.2 0-3.8-1.6-3.8-3.8C10.4 8.2 12 9.8 12 12z"/>
      <path d="M12 12c2.2 0 3.8-1.6 3.8-3.8C13.6 8.2 12 9.8 12 12z"/>
      <path d="M12 8.5c-2 0-3.5-1.5-3.5-3.5C10.5 5 12 6.5 12 8.5z"/>
      <path d="M12 8.5c2 0 3.5-1.5 3.5-3.5C13.5 5 12 6.5 12 8.5z"/>
      <path d="M12 5c-1.6 0-2.8-1.3-2.8-2.9C11.2 2.1 12 3.4 12 5z"/>
      <path d="M12 5c1.6 0 2.8-1.3 2.8-2.9C12.8 2.1 12 3.4 12 5z"/>
    </symbol>

    <!-- Eggs -->
    <symbol id="ai-egg" viewBox="0 0 24 24">
      <path d="M12 2.5c-3.6 0-6.5 5-6.5 9.8a6.5 6.5 0 0 0 13 0C18.5 7.5 15.6 2.5 12 2.5z"/>
    </symbol>

    <!-- Soy: two beans -->
    <symbol id="ai-soy" viewBox="0 0 24 24">
      <circle cx="9.5" cy="10" r="3.6"/>
      <circle cx="14.5" cy="14.5" r="3.6"/>
    </symbol>

    <!-- Peanut -->
    <symbol id="ai-peanut" viewBox="0 0 24 24">
      <path d="M9 7.5a3 3 0 0 1 6 0c0 1.6-1 2.1-1 4s1 2.4 1 4a3 3 0 0 1-6 0c0-1.6 1-2.1 1-4s-1-2.4-1-4z"/>
      <line x1="9.6" y1="11.5" x2="14.4" y2="11.5"/>
    </symbol>

    <!-- Tree nuts: acorn -->
    <symbol id="ai-nut" viewBox="0 0 24 24">
      <path d="M7 8.5a5 5 0 0 1 10 0z"/>
      <path d="M8 8.5c0 5 1.6 9.5 4 9.5s4-4.5 4-9.5"/>
      <line x1="12" y1="3" x2="12" y2="5"/>
    </symbol>

    <!-- Fish -->
    <symbol id="ai-fish" viewBox="0 0 24 24">
      <path d="M3 12c3-4.5 9.5-4.5 13 0-3.5 4.5-10 4.5-13 0z"/>
      <path d="M16 12l5-3.2v6.4z"/>
      <circle cx="7" cy="10.7" r="0.6" fill="currentColor"/>
    </symbol>

    <!-- Shellfish: shrimp curl -->
    <symbol id="ai-shellfish" viewBox="0 0 24 24">
      <path d="M19 6.5a8.5 8.5 0 0 1-8.5 8.5H7a3 3 0 0 0 3 3"/>
      <path d="M19 6.5c-1.6 0-2.7.6-3.6 1.6"/>
      <path d="M6.5 15l-2-1.2M6.8 15.6l-1.2-2"/>
    </symbol>

    <!-- Sesame: seeds -->
    <symbol id="ai-sesame" viewBox="0 0 24 24">
      <ellipse cx="9" cy="10" rx="1.6" ry="2.6" transform="rotate(-22 9 10)"/>
      <ellipse cx="15" cy="9" rx="1.6" ry="2.6" transform="rotate(22 15 9)"/>
      <ellipse cx="12" cy="15" rx="1.6" ry="2.6"/>
    </symbol>

    <!-- Mustard: squeeze bottle -->
    <symbol id="ai-mustard" viewBox="0 0 24 24">
      <path d="M10 2.5h4v2.2l1 2.3V20a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 20V7l1-2.3V2.5z"/>
      <line x1="9" y1="11" x2="15" y2="11"/>
    </symbol>

    <!-- Celery: stalk with leaves -->
    <symbol id="ai-celery" viewBox="0 0 24 24">
      <path d="M12 22V8"/>
      <path d="M12 8c-3.2-1-5.2 1-5.2 4.2"/>
      <path d="M12 8c3.2-1 5.2 1 5.2 4.2"/>
      <path d="M12 8c0-3.2 2-5.2 4.4-5.2"/>
    </symbol>

    <!-- Fallback: generic warning -->
    <symbol id="ai-generic" viewBox="0 0 24 24">
      <path d="M12 3.5l9 16.5H3z"/>
      <line x1="12" y1="10" x2="12" y2="14.5"/>
      <circle cx="12" cy="17.5" r="0.7" fill="currentColor"/>
    </symbol>

  </defs>
</svg>
